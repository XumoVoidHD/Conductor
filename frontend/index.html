<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Conductor — Dashboard</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Sora:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="atmosphere" aria-hidden="true"></div>
    <div class="grid-lines" aria-hidden="true"></div>

    <!-- Auth gate -->
    <div class="shell auth-shell" id="auth-shell">
      <header class="top auth-top">
        <div>
          <p class="brand">Conductor</p>
          <p class="tagline">Create an account or sign in to deploy strategies</p>
        </div>
      </header>

      <p class="banner" id="auth-banner" hidden></p>

      <section class="panel auth-panel">
        <div class="auth-tabs">
          <button type="button" class="auth-tab is-active" data-tab="login" id="tab-login">
            Sign in
          </button>
          <button type="button" class="auth-tab" data-tab="register" id="tab-register">
            Register
          </button>
        </div>

        <form id="login-form" class="auth-form">
          <label class="field">
            <span>Username</span>
            <input type="text" name="username" autocomplete="username" required />
          </label>
          <label class="field">
            <span>Password</span>
            <input type="password" name="password" autocomplete="current-password" required />
          </label>
          <button type="submit" class="btn-primary" id="login-btn">Sign in</button>
        </form>

        <form id="register-form" class="auth-form" hidden>
          <label class="field">
            <span>Username</span>
            <input type="text" name="username" autocomplete="username" required />
          </label>
          <label class="field">
            <span>Email</span>
            <input type="text" name="email" autocomplete="email" required />
          </label>
          <label class="field">
            <span>Password</span>
            <input type="password" name="password" autocomplete="new-password" required />
          </label>
          <button type="submit" class="btn-primary" id="register-btn">Create account</button>
        </form>
      </section>
    </div>

    <!-- Dashboard (shown when logged in) -->
    <div class="shell" id="dash-shell" hidden>
      <header class="top">
        <div>
          <p class="brand">Conductor</p>
          <p class="tagline">
            Signed in as <strong id="user-label">—</strong>
          </p>
        </div>
        <div class="top-actions">
          <div class="status-pill" id="status-pill">checking…</div>
          <button type="button" class="btn-ghost" id="logout-btn">Log out</button>
        </div>
      </header>

      <div class="toast-stack" id="toast-stack" aria-live="polite"></div>

      <section class="block">
        <div class="block-head">
          <h2>Strategies</h2>
          <button type="button" class="btn-ghost" id="refresh-strategies">Refresh</button>
        </div>
        <div class="strategy-grid" id="strategy-grid">
          <p class="muted">Loading strategies…</p>
        </div>
      </section>

      <section class="block">
        <div class="block-head">
          <h2>Nodes <span class="muted" id="nodes-quota">—</span></h2>
          <button type="button" class="btn-ghost" id="refresh-nodes">Refresh</button>
        </div>
        <div class="nodes-table-wrap">
          <table class="nodes-table" id="nodes-table">
            <thead>
              <tr>
                <th>Node</th>
                <th>Strategy</th>
                <th>Status</th>
                <th>Broker</th>
                <th>Actions</th>
              </tr>
            </thead>
            <tbody id="nodes-body">
              <tr>
                <td colspan="5" class="muted">No nodes yet</td>
              </tr>
            </tbody>
          </table>
        </div>
      </section>
    </div>

    <script src="config.js?v=20260801"></script>
    <script src="app.js?v=20260801"></script>
  </body>
</html>
