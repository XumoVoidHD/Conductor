services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-conductor}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-conductor}
      POSTGRES_DB: ${POSTGRES_DB:-conductor}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - conductor-api-postgres:/var/lib/postgresql/data
    networks:
      - conductor-api-net
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-conductor} -d ${POSTGRES_DB:-conductor}",
        ]
      interval: 5s
      timeout: 3s
      retries: 10

  # Optional: run the API in Docker later
  # api:
  #   build:
  #     context: .
  #     dockerfile: Dockerfile
  #   ports:
  #     - "8000:8000"
  #   env_file: .env
  #   environment:
  #     POSTGRES_HOST: postgres
  #   depends_on:
  #     postgres:
  #       condition: service_healthy
  #   networks:
  #     - conductor-api-net

networks:
  conductor-api-net:
    name: conductor-api-net
    driver: bridge

volumes:
  conductor-api-postgres:
    name: conductor-api-postgres
