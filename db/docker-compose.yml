# Deprecated — Postgres (and the rest of core) live in conductor-core/.
#
# Use:
#   docker compose -f conductor-core/compose.yaml up -d postgres
#
# This stub remains so old scripts that point at db/docker-compose.yml fail loudly
# with a clear message instead of silently creating a second Postgres.

services:
  _moved_to_conductor_core:
    image: alpine:3.20
    profiles: ["never"]
    entrypoint:
      [
        "sh",
        "-c",
        "echo 'db/docker-compose.yml is retired. Use conductor-core/compose.yaml' && exit 1",
      ]
