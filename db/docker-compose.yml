services:
  postgres:
    image: postgres:16-alpine
    container_name: conductor-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-conductor}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-conductor}
      POSTGRES_DB: ${POSTGRES_DB:-conductor}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - conductor-postgres:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-conductor} -d ${POSTGRES_DB:-conductor}",
        ]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  conductor-postgres:
    name: conductor-postgres
